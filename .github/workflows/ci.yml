name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint -- --max-warnings=0

      - name: Typecheck
        run: bun run typecheck

      - name: Test TypeScript and TSX
        run: bun run test

      - name: Build and verify Netlify runtime
        run: bun run build:netlify
        env:
          APP_ORIGIN: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_ORIGIN: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  database:
    name: Database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Supabase
        run: bun x supabase start

      - name: Reset database
        run: bun x supabase db reset --local

      - name: Generate database snapshot
        run: bun run db:snapshot

      - name: Upload generated database snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-schema-snapshot-${{ github.run_attempt }}
          path: supabase/schema.sql
          if-no-files-found: error
          retention-days: 3

      - name: Generate database types
        run: bun run db:types

      - name: Upload generated database types
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-types-${{ github.run_attempt }}
          path: lib/supabase/database.types.ts
          if-no-files-found: error
          retention-days: 3

      - name: Test database
        run: bun run test:db

      - name: Lint database
        run: bun x supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Run database advisors
        run: bun x supabase db advisors --local --type all --level warn --fail-on error

      - name: Test guarded client purge end to end
        shell: bash
        run: |
          set -euo pipefail
          eval "$(bun x supabase status -o env)"
          CI=true \
          MONALYZ_ALLOW_DESTRUCTIVE_LOCAL_PURGE_TEST=1 \
          SUPABASE_URL="${API_URL}" \
          SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}" \
          SUPABASE_ANON_KEY="${ANON_KEY}" \
          CLIENT_PURGE_CHALLENGE_SECRET="ci-only-client-purge-challenge-secret-2026" \
          bun run test:client-purge:integration

      - name: Check committed database snapshot
        run: git diff --exit-code -- supabase/schema.sql

      - name: Check committed database types
        run: git diff --exit-code -- lib/supabase/database.types.ts

      - name: Stop Supabase
        if: always()
        run: bun x supabase stop --no-backup
