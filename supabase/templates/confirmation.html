<!doctype html>
<html lang="fr">
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
            style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px">
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 16px;font-size:24px">Confirmez votre compte KALY</h1>
                <p style="margin:0 0 24px;line-height:1.6">
                  Confirmez votre adresse e-mail pour terminer la création de votre compte
                  applicatif. KALY ne crée pas de compte bancaire et ne se connecte à aucune banque.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                    style="display:inline-block;padding:12px 20px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:10px;font-weight:700">
                    Confirmer mon adresse
                  </a>
                </p>
                <p style="margin:0;color:#64748b;font-size:13px;line-height:1.5">
                  Si vous n’avez pas créé ce compte, ignorez ce message.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
