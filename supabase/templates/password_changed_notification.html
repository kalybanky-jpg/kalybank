<!doctype html>
<html lang="fr">
  <body style="margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding:32px 16px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
            style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px">
            <tr>
              <td style="padding:32px">
                <img src="{{ .SiteURL }}/brand/monalyz/monalyz-wordmark-email-360.png"
                  width="180" alt="Monalyz"
                  style="display:block;width:180px;max-width:100%;height:auto;border:0;margin:0 0 24px">
                <h1 style="margin:0 0 16px;font-size:24px">Mot de passe modifié</h1>
                <p style="margin:0;line-height:1.6">
                  Le mot de passe du compte Monalyz associé à {{ .Email }} vient d’être modifié.
                  Si vous n’êtes pas à l’origine de cette action, demandez immédiatement une
                  nouvelle réinitialisation depuis l’application ou contactez
                  <a href="mailto:support@monalyz.com" style="color:#2563eb">support@monalyz.com</a>.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
