[build]
  # Manual/API deploys may be assembled on a non-Linux host. Install the
  # target optional dependencies as well so native packages such as sharp are
  # traced for Netlify Functions (Linux x64).
  command = "bun run build:netlify"
  publish = ".next"

[build.environment]
  BUN_VERSION = "1.3.14"
  BUN_FLAGS = "--frozen-lockfile"
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_CANONICAL_ORIGIN = "https://bank.monalyz.com"
  NEXT_PUBLIC_APP_ORIGIN = "https://bank.monalyz.com"
  APP_ORIGIN = "https://bank.monalyz.com"
  NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION = "googlecdd3581b40b5ac13.html"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
